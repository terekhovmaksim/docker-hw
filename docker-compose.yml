x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PORT: "8000"
      APP_VERSION: "1.0.0"
  environment:
    PORT: "8000"
    APP_NAME: "Docker Hello App"
    APP_VERSION: "${APP_VERSION:-1.0.0}"
  restart: unless-stopped
  networks:
    - appnet

services:
  web:
    <<: *app
    container_name: compose-web-1
    ports:
      - "8081:8000"

  web-2:
    <<: *app
    container_name: compose-web-2
    ports:
      - "8082:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: compose-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      web-2:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  appnet:
    name: docker-homework-net
    driver: bridge
